name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Unit & Integration Tests
        working-directory: ./backend
        run: npm test

      - name: Evaluation Gate (False-FAIL rate check)
        working-directory: ./backend
        run: npm run eval:gate

      - name: Validate Rule Set and Seed Data
        working-directory: ./backend
        run: node -e "import('./modules/rules/rules.service.js').then(m => m.getActiveRuleSet())"
